services:

  # ─── Application (PHP-FPM) ────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-parking-app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-smart_parking}
      - DB_USERNAME=${DB_USERNAME:-root}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - SESSION_DRIVER=database
      - CACHE_STORE=database
      - QUEUE_CONNECTION=database
      - BROADCAST_CONNECTION=log
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_APP_KEY=${PUSHER_APP_KEY:-}
      - PUSHER_APP_SECRET=${PUSHER_APP_SECRET:-}
      - PUSHER_APP_CLUSTER=${PUSHER_APP_CLUSTER:-mt1}
    networks:
      - smart-parking-net
    depends_on:
      mysql:
        condition: service_healthy

  # ─── Nginx Web Server ─────────────────────────────────
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: smart-parking-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    networks:
      - smart-parking-net
    depends_on:
      - app

  # ─── MySQL Database ───────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: smart-parking-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-smart_parking}
    ports:
      - "${DB_PORT_EXPOSE:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - smart-parking-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

# ─── Volumes ──────────────────────────────────────────
volumes:
  mysql_data:

# ─── Network ──────────────────────────────────────────
networks:
  smart-parking-net:
    driver: bridge
